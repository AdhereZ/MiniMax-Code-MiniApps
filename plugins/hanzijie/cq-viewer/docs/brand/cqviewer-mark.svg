<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="t">
  <title id="t">CadQuery Viewer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152849"/>
      <stop offset="1" stop-color="#070E1C"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="480" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F86FF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2F86FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="512" cy="792" r="260" gradientTransform="translate(0 792) scale(1 0.2) translate(0 -792)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000611" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#000611" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="512" y1="284" x2="512" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C6E8FF"/>
      <stop offset="1" stop-color="#7AC3FF"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F9CFF"/>
      <stop offset="1" stop-color="#2070DE"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C63D0"/>
      <stop offset="1" stop-color="#0F3D8F"/>
    </linearGradient>
    <linearGradient id="orbitFront" x1="120" y1="0" x2="904" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <filter id="spark" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- the near half of the orbit cuts a clean gap into the cube -->
    <mask id="ringGap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <g transform="rotate(-16 512 520)">
        <path d="M904 520 A392 132 0 0 1 120 520" fill="none" stroke="#000000" stroke-width="32"/>
      </g>
    </mask>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- tile -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>

    <!-- ground shadow -->
    <ellipse cx="512" cy="792" rx="260" ry="52" fill="url(#shadow)"/>

    <!-- orbit: far half (behind the cube) -->
    <g transform="rotate(-16 512 520)">
      <path d="M120 520 A392 132 0 0 1 904 520" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- cube with CAD edges -->
    <g mask="url(#ringGap)">
      <path d="M307.6 402 L512 520 L512 756 L307.6 638 Z" fill="url(#left)"/>
      <path d="M512 520 L716.4 402 L716.4 638 L512 756 Z" fill="url(#right)"/>
      <path d="M512 284 L716.4 402 L512 520 L307.6 402 Z" fill="url(#top)"/>
      <path d="M512 284 L716.4 402 L512 520 L307.6 402 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="5" stroke-linejoin="round"/>
      <path d="M512 520 L512 756" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
      <path d="M307.6 402 L307.6 638 L512 756 L716.4 638 L716.4 402" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <!-- orbit: near half (in front of the cube) with the camera -->
    <g transform="rotate(-16 512 520)">
      <path d="M904 520 A392 132 0 0 1 120 520" fill="none" stroke="url(#orbitFront)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="812.3" cy="604.8" r="16" fill="#FFFFFF" filter="url(#spark)"/>
    </g>

    <!-- annotation: target ring on the top face + marker pin -->
    <ellipse cx="512" cy="402" rx="78" ry="45" fill="none" stroke="#FF8A3D" stroke-width="11"/>
    <ellipse cx="512" cy="402" rx="20" ry="11.5" fill="#FF8A3D"/>
    <path d="M512 402 L512 314" stroke="#FF8A3D" stroke-width="11" stroke-linecap="round"/>
    <circle cx="512" cy="292" r="34" fill="#FF8A3D"/>
    <circle cx="512" cy="292" r="12" fill="#FFFFFF"/>
  </g>
  <!-- hairline rim: keeps the tile edge readable on dark backgrounds -->
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="6"/>
</svg>
